<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird;
let pipes;
let score;
let gameOver;
let started;

const gravity = 0.45;
const jump = -7;
const pipeWidth = 60;
const pipeGap = 150;
const pipeSpeed = 2.5;

function resetGame() {
  bird = {
    x: 80,
    y: 300,
    size: 25,
    velocity: 0
  };

  pipes = [];
  score = 0;
  gameOver = false;
  started = false;
}

function flap() {
  if (gameOver) {
    resetGame();
    return;
  }

  started = true;
  bird.velocity = jump;
}

function createPipe() {
  const topHeight =
    Math.random() * 250 + 50;

  pipes.push({
    x: canvas.width,
    top: topHeight,
    bottom: topHeight + pipeGap,
    passed: false
  });
}

function update() {
  if (!started || gameOver) return;

  bird.velocity += gravity;
  bird.y += bird.velocity;

  // nieuwe pipes
  if (
    pipes.length === 0 ||
    pipes[pipes.length - 1].x < 220
  ) {
    createPipe();
  }

  // pipes bewegen
  for (let pipe of pipes) {
    pipe.x -= pipeSpeed;

    // score
    if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
      score++;
      pipe.passed = true;
    }

    // collision
    if (
      bird.x < pipe.x + pipeWidth &&
      bird.x + bird.size > pipe.x &&
      (
        bird.y < pipe.top ||
        bird.y + bird.size > pipe.bottom
      )
    ) {
      gameOver = true;
    }
  }

  // pipes verwijderen
  pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);

  // grond/plafond
  if (
    bird.y + bird.size > canvas.height ||
    bird.y < 0
  ) {
    gameOver = true;
  }
}

function drawBird() {
  ctx.fillStyle = "#FFD93D";
  ctx.fillRect(
    bird.x,
    bird.y,
    bird.size,
    bird.size
  );

  // oog
  ctx.fillStyle = "black";
  ctx.fillRect(
    bird.x + 17,
    bird.y + 5,
    5,
    5
  );
}

function drawPipes() {
  ctx.fillStyle = "#4CAF50";

  for (let pipe of pipes) {
    // bovenste pipe
    ctx.fillRect(
      pipe.x,
      0,
      pipeWidth,
      pipe.top
    );

    // onderste pipe
    ctx.fillRect(
      pipe.x,
      pipe.bottom,
      pipeWidth,
      canvas.height - pipe.bottom
    );
  }
}

function draw() {
  // lucht
  ctx.fillStyle = "#70c5ce";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawPipes();
  drawBird();

  // score
  ctx.fillStyle = "white";
  ctx.font = "40px Arial";
  ctx.textAlign = "center";
  ctx.fillText(score, canvas.width / 2, 60);

  if (!started && !gameOver) {
    ctx.font = "24px Arial";
    ctx.fillText(
      "Klik of druk op SPACE",
      canvas.width / 2,
      300
    );
  }

  if (gameOver) {
    ctx.font = "40px Arial";
    ctx.fillText(
      "GAME OVER",
      canvas.width / 2,
      280
    );

    ctx.font = "22px Arial";
    ctx.fillText(
      "Klik om opnieuw te spelen",
      canvas.width / 2,
      320
    );
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// muisklik
canvas.addEventListener("click", flap);

// toetsenbord
document.addEventListener("keydown", (event) => {
  if (event.code === "Space") {
    event.preventDefault();
    flap();
  }
});

// mobiel/touch
canvas.addEventListener("touchstart", (event) => {
  event.preventDefault();
  flap();
});

resetGame();
gameLoop();
</script>

</body>
</html>
