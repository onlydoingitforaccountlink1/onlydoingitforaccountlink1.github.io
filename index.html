
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Street Combat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111;font-family:Arial;color:white}
canvas{display:block}
#hud{position:absolute;top:15px;left:20px;font-size:19px;line-height:1.7;text-shadow:2px 2px 4px black;pointer-events:none}
#title{position:absolute;top:15px;width:100%;text-align:center;font-size:27px;font-weight:bold;color:#00ff88;text-shadow:2px 2px 5px black;pointer-events:none}
#help{position:absolute;bottom:15px;width:100%;text-align:center;color:white;text-shadow:2px 2px 4px black;font-size:14px;pointer-events:none}
#screen{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#screen h1{font-size:48px;color:#00ff88;margin-bottom:20px}
#screen p{font-size:18px;margin:8px}
button{padding:15px 35px;background:#00ff88;border:0;font-size:20px;font-weight:bold;cursor:pointer;margin-top:25px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="title">STREET COMBAT 3D</div>
<div id="hud">
Score: <span id="score">0</span><br>
Levens: <span id="lives">3</span><br>
Snelheid: <span id="speed">0</span> km/u
</div>
<div id="help">WASD / PIJLTJES = RIJDEN | SPATIE = SCHIETEN</div>

<div id="screen">
<h1>STREET COMBAT 3D</h1>
<p>Race door de stad en vernietig vijandelijke auto's.</p>
<p>WASD om te rijden</p>
<p>SPATIE om te schieten</p>
<button id="start">START GAME</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,180);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,300);
camera.position.set(0,7,13);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555566,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-20,40,20);
sun.castShadow=true;
scene.add(sun);

const mat=(color,roughness=0.8)=>new THREE.MeshStandardMaterial({color,roughness});

const roadMat=mat(0x303038);
const grassMat=mat(0x287a35);
const lineMat=mat(0xffffff);
const dark=mat(0x111111);
const glass= new THREE.MeshStandardMaterial({color:0x142b40,metalness:0.5,roughness:0.2});
const yellow=mat(0xffcc00);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),grassMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.1;
scene.add(floor);

const road=new THREE.Mesh(new THREE.PlaneGeometry(15,1000),roadMat);
road.rotation.x=-Math.PI/2;
road.position.y=0;
scene.add(road);

for(let x of [-7.4,7.4]){
const edge=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.08,1000),yellow);
edge.position.set(x,0.05,0);
scene.add(edge);
}

const markings=[];
for(let z=-200;z<30;z+=12){
const m=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.04,5),lineMat);
m.position.set(0,0.04,z);
scene.add(m);
markings.push(m);
}

const buildings=[];
for(let i=0;i<55;i++){
for(let side of [-1,1]){
const h=8+Math.random()*25;
const w=5+Math.random()*8;
const b=new THREE.Mesh(
new THREE.BoxGeometry(w,h,8+Math.random()*8),
mat([0x777788,0x555566,0x997766,0x445566,0x888899][Math.floor(Math.random()*5)])
);
b.position.set(side*(13+Math.random()*15),h/2,-i*18-20);
scene.add(b);
buildings.push(b);

const windows=new THREE.Mesh(
new THREE.BoxGeometry(w*0.8,h*0.7,0.05),
new THREE.MeshBasicMaterial({color:0x88bbcc})
);
windows.position.set(b.position.x,b.position.y,b.position.z+4.05);
scene.add(windows);
buildings.push(windows);
}
}

function createCar(color){
const group=new THREE.Group();

const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.65,4),mat(color,0.3));
body.position.y=0.85;
body.castShadow=true;
group.add(body);

const hood=new THREE.Mesh(new THREE.BoxGeometry(1.85,0.22,1.15),mat(color,0.3));
hood.position.set(0,1.23,-1.25);
group.add(hood);

const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.75,1.8),glass);
cabin.position.set(0,1.45,0.25);
group.add(cabin);

const roof=new THREE.Mesh(new THREE.BoxGeometry(1.48,0.12,1.65),mat(color));
roof.position.set(0,1.85,0.25);
group.add(roof);

for(let x of [-1.03,1.03]){
for(let z of [-1.25,1.25]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.3,16),dark);
wheel.rotation.z=Math.PI/2;
wheel.position.set(x,0.48,z);
group.add(wheel);
}
}

for(let x of [-0.7,0.7]){
const light=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.2,0.08),yellow);
light.position.set(x,0.95,-2.02);
group.add(light);
const rear=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.2,0.08),mat(0xff0000));
rear.position.set(x,0.95,2.02);
group.add(rear);
}

return group;
}

const player=createCar(0x00aaff);
player.position.set(0,0,3);
scene.add(player);

let enemies=[];
let bullets=[];
let explosions=[];
let score=0;
let lives=3;
let speed=0;
let gameRunning=false;
let gameOver=false;
let frame=0;
let keys={};
let lastShot=0;

const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const speedEl=document.getElementById("speed");
const screen=document.getElementById("screen");

document.addEventListener("keydown",e=>{
keys[e.code]=true;
if(e.code==="Space")e.preventDefault();
});

document.addEventListener("keyup",e=>keys[e.code]=false);

function shoot(){
const bullet=new THREE.Mesh(
new THREE.SphereGeometry(0.16,10,10),
new THREE.MeshBasicMaterial({color:0xffff00})
);
bullet.position.set(player.position.x,1.2,player.position.z-2.5);
scene.add(bullet);
bullets.push(bullet);
}

function spawnEnemy(){
const e=createCar([0xff2222,0xff8800,0xaa22ff,0xffffff,0x22cc55][Math.floor(Math.random()*5)]);
e.position.set((Math.random()-0.5)*10,0,-110);
scene.add(e);
enemies.push(e);
}

function explode(position){
const geometry=new THREE.SphereGeometry(0.5,8,8);
const material=new THREE.MeshBasicMaterial({color:0xff6600});
const explosion=new THREE.Mesh(geometry,material);
explosion.position.copy(position);
scene.add(explosion);
explosions.push({mesh:explosion,time:0});
}

function reset(){
enemies.forEach(e=>scene.remove(e));
bullets.forEach(b=>scene.remove(b));
explosions.forEach(e=>scene.remove(e.mesh));

enemies=[];
bullets=[];
explosions=[];
player.position.set(0,0,3);
player.rotation.set(0,0,0);
score=0;
lives=3;
speed=0;
frame=0;
gameOver=false;
gameRunning=true;
keys={};
screen.classList.add("hidden");
}

function endGame(){
gameRunning=false;
gameOver=true;
screen.innerHTML=`
<h1>GAME OVER</h1>
<p>Je score: ${score}</p>
<p>Je hebt ${score/100} vijanden verslagen.</p>
<button id="restart">OPNIEUW SPELEN</button>
`;
screen.classList.remove("hidden");
document.getElementById("restart").onclick=reset;
}

function update(){
if(!gameRunning)return;

frame++;

if(keys["ArrowUp"]||keys["KeyW"])speed=Math.min(speed+0.12,2.5);
else speed=Math.max(speed-0.025,0);

if(keys["ArrowDown"]||keys["KeyS"])speed=Math.max(speed-0.12,0);

if(keys["ArrowLeft"]||keys["KeyA"])player.position.x-=0.17;
if(keys["ArrowRight"]||keys["KeyD"])player.position.x+=0.17;

player.position.x=THREE.MathUtils.clamp(player.position.x,-5.5,5.5);

player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,
(keys["ArrowLeft"]||keys["KeyA"])?0.12:
(keys["ArrowRight"]||keys["KeyD"])?-0.12:0,0.1);

if(keys["Space"]&&frame-lastShot>12){
shoot();
lastShot=frame;
}

const movement=0.35+speed*0.8;

markings.forEach(m=>{
m.position.z+=movement;
if(m.position.z>15)m.position.z-=240;
});

buildings.forEach(b=>{
b.position.z+=movement;
if(b.position.z>20)b.position.z-=1000;
});

if(frame%65===0)spawnEnemy();

enemies.forEach(e=>{
e.position.z+=movement+0.35;
});

bullets.forEach(b=>{
b.position.z-=2.5;
});

for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];
let hit=false;

for(let j=enemies.length-1;j>=0;j--){
const e=enemies[j];
if(b.position.distanceTo(new THREE.Vector3(e.position.x,1,e.position.z))<2.2){
explode(e.position);
scene.remove(e);
enemies.splice(j,1);
score+=100;
hit=true;
break;
}
}

if(hit||b.position.z<-130){
scene.remove(b);
bullets.splice(i,1);
}
}

for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];

if(Math.abs(e.position.x-player.position.x)<1.8 &&
Math.abs(e.position.z-player.position.z)<3){
explode(e.position);
scene.remove(e);
enemies.splice(i,1);
lives--;
if(lives<=0)endGame();
}

else if(e.position.z>15){
scene.remove(e);
enemies.splice(i,1);
}
}

for(let i=explosions.length-1;i>=0;i--){
const e=explosions[i];
e.time++;
e.mesh.scale.multiplyScalar(1.06);
e.mesh.material.opacity=1-e.time/20;
e.mesh.material.transparent=true;
if(e.time>20){
scene.remove(e.mesh);
explosions.splice(i,1);
}
}

const target=new THREE.Vector3(player.position.x*0.4,6,12);
camera.position.lerp(target,0.06);
camera.lookAt(player.position.x*0.35,1,-12);

scoreEl.textContent=score;
livesEl.textContent=lives;
speedEl.textContent=Math.round(speed*90);
}

function animate(){
requestAnimationFrame(animate);
update();
renderer.render(scene,camera);
}

document.getElementById("start").onclick=reset;

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

animate();
</script>
</body>
</html>
