<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  width: 100%;
  max-width: 650px;
  text-align: center;
  padding: 15px;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

#menu {
  background: #1d1d1d;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 0 25px #000;
}

#menu h2 {
  margin-bottom: 15px;
}

.mode {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.mode:hover {
  background: #4caf50;
}

#gameArea {
  display: none;
}

#info {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
  font-size: 18px;
}

canvas {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1 / 1;
  background: #181818;
  border: 4px solid #333;
  border-radius: 12px;
}

button {
  cursor: pointer;
}

.controls {
  margin-top: 15px;
  display: grid;
  grid-template-columns: repeat(3, 70px);
  justify-content: center;
  gap: 8px;
}

.controls button {
  width: 70px;
  height: 55px;
  border: none;
  border-radius: 12px;
  background: #333;
  color: white;
  font-size: 24px;
}

.controls button:active {
  background: #4caf50;
}

#pause,
#restart,
#back {
  margin: 12px 4px 0;
  padding: 10px 16px;
  border: none;
  border-radius: 9px;
  background: #333;
  color: white;
}

#pause:hover,
#restart:hover,
#back:hover {
  background: #4caf50;
}

#message {
  margin-top: 12px;
  min-height: 25px;
  font-size: 18px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div id="game">

  <h1>🐍 Snake</h1>

  <div id="menu">
    <h2>Kies je gamemode</h2>

    <button class="mode" onclick="startGame('classic')">
      🟢 Classic
    </button>

    <button class="mode" onclick="startGame('speed')">
      ⚡ Speed
    </button>

    <button class="mode" onclick="startGame('walls')">
      🧱 Walls
    </button>

    <button class="mode" onclick="startGame('nowalls')">
      🌎 No Walls
    </button>

    <button class="mode" onclick="startGame('survival')">
      ☠️ Survival
    </button>

    <p style="margin-top:15px; color:#aaa;">
      Gebruik WASD of de pijltjestoetsen
    </p>
  </div>

  <div id="gameArea">

    <div id="info">
      <span>Score: <b id="score">0</b></span>
      <span>Highscore: <b id="highscore">0</b></span>
      <span id="modeText">Classic</span>
    </div>

    <canvas id="canvas" width="600" height="600"></canvas>

    <div id="message"></div>

    <button id="pause" onclick="togglePause()">⏸ Pauze</button>
    <button id="restart" onclick="restartGame()">🔄 Restart</button>
    <button id="back" onclick="backToMenu()">🏠 Menu</button>

    <div class="controls">
      <div></div>
      <button onclick="changeDirection('up')">⬆️</button>
      <div></div>

      <button onclick="changeDirection('left')">⬅️</button>
      <button onclick="changeDirection('down')">⬇️</button>
      <button onclick="changeDirection('right')">➡️</button>
    </div>

  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const grid = 30;
const tile = canvas.width / grid;

let snake;
let food;
let powerUp;
let direction;
let nextDirection;

let score = 0;
let highscore = Number(localStorage.getItem("snakeHighscore")) || 0;

let gameMode = "classic";
let gameRunning = false;
let paused = false;
let gameLoop;
let speed = 120;

document.getElementById("highscore").textContent = highscore;


/* =========================
   GAME MODES
========================= */

const modes = {
  classic: {
    name: "🟢 Classic",
    speed: 120,
    walls: true,
    powerups: true
  },

  speed: {
    name: "⚡ Speed",
    speed: 65,
    walls: true,
    powerups: true
  },

  walls: {
    name: "🧱 Walls",
    speed: 100,
    walls: true,
    powerups: false
  },

  nowalls: {
    name: "🌎 No Walls",
    speed: 105,
    walls: false,
    powerups: true
  },

  survival: {
    name: "☠️ Survival",
    speed: 75,
    walls: true,
    powerups: true
  }
};


/* =========================
   START GAME
========================= */

function startGame(mode) {

  gameMode = mode;

  document.getElementById("menu").style.display = "none";
  document.getElementById("gameArea").style.display = "block";

  speed = modes[mode].speed;

  document.getElementById("modeText").textContent =
    modes[mode].name;

  resetGame();
}


/* =========================
   RESET
========================= */

function resetGame() {

  clearInterval(gameLoop);

  snake = [
    { x: 15, y: 15 },
    { x: 14, y: 15 },
    { x: 13, y: 15 }
  ];

  direction = "right";
  nextDirection = "right";

  score = 0;
  paused = false;
  gameRunning = true;

  powerUp = null;

  document.getElementById("score").textContent = score;
  document.getElementById("message").textContent = "";

  spawnFood();

  gameLoop = setInterval(update, speed);
}


/* =========================
   RESTART
========================= */

function restartGame() {
  resetGame();
}


/* =========================
   MENU
========================= */

function backToMenu() {

  clearInterval(gameLoop);

  gameRunning = false;

  document.getElementById("gameArea").style.display = "none";
  document.getElementById("menu").style.display = "block";
}


/* =========================
   FOOD
========================= */

function spawnFood() {

  do {
    food = {
      x: Math.floor(Math.random() * grid),
      y: Math.floor(Math.random() * grid)
    };
  } while (isSnake(food));

  if (
    modes[gameMode].powerups &&
    Math.random() < 0.15
  ) {
    spawnPowerUp();
  }
}


function spawnPowerUp() {

  const types = ["speed", "score", "shrink"];

  do {
    powerUp = {
      x: Math.floor(Math.random() * grid),
      y: Math.floor(Math.random() * grid),
      type: types[Math.floor(Math.random() * types.length)]
    };
  } while (isSnake(powerUp));
}


/* =========================
   UPDATE
========================= */

function update() {

  if (!gameRunning || paused) return;

  direction = nextDirection;

  const head = {
    x: snake[0].x,
    y: snake[0].y
  };

  head.x +=
    direction === "right" ? 1 :
    direction === "left" ? -1 : 0;

  head.y +=
    direction === "down" ? 1 :
    direction === "up" ? -1 : 0;


  /* NO WALLS MODE */

  if (!modes[gameMode].walls) {

    if (head.x < 0) head.x = grid - 1;
    if (head.x >= grid) head.x = 0;

    if (head.y < 0) head.y = grid - 1;
    if (head.y >= grid) head.y = 0;
  }


  /* WALL COLLISION */

  if (modes[gameMode].walls) {

    if (
      head.x < 0 ||
      head.x >= grid ||
      head.y < 0 ||
      head.y >= grid
    ) {
      endGame();
      return;
    }
  }


  /* SELF COLLISION */

  if (isSnake(head)) {

    if (gameMode === "survival") {
      endGame();
      return;
    }

    endGame();
    return;
  }


  snake.unshift(head);


  /* FOOD */

  if (
    head.x === food.x &&
    head.y === food.y
  ) {

    score++;

    document.getElementById("score").textContent = score;

    if (score > highscore) {
      highscore = score;
      localStorage.setItem(
        "snakeHighscore",
        highscore
      );

      document.getElementById("highscore")
        .textContent = highscore;
    }

    spawnFood();

  } else {

    snake.pop();
  }


  /* POWERUP */

  if (
    powerUp &&
    head.x === powerUp.x &&
    head.y === powerUp.y
  ) {

    usePowerUp(powerUp.type);
    powerUp = null;
  }


  draw();
}


/* =========================
   POWERUPS
========================= */

function usePowerUp(type) {

  if (type === "score") {

    score += 5;

    document.getElementById("message")
      .textContent = "⭐ +5 punten!";

  }


  if (type === "shrink") {

    snake.splice(
      Math.floor(snake.length / 2)
    );

    document.getElementById("message")
      .textContent = "✂️ Snake kleiner!";
  }


  if (type === "speed") {

    clearInterval(gameLoop);

    speed = Math.max(35, speed - 15);

    gameLoop = setInterval(update, speed);

    document.getElementById("message")
      .textContent = "⚡ Speed boost!";
  }

  document.getElementById("score")
    .textContent = score;
}


/* =========================
   DRAW
========================= */

function draw() {

  ctx.fillStyle = "#181818";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* GRID */

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 1;

  for (let i = 0; i <= grid; i++) {

    ctx.beginPath();
    ctx.moveTo(i * tile, 0);
    ctx.lineTo(i * tile, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * tile);
    ctx.lineTo(canvas.width, i * tile);
    ctx.stroke();
  }


  /* FOOD */

  ctx.fillStyle = "#ff4444";

  ctx.beginPath();

  ctx.arc(
    food.x * tile + tile / 2,
    food.y * tile + tile / 2,
    tile * 0.35,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* POWERUP */

  if (powerUp) {

    if (powerUp.type === "speed")
      ctx.fillStyle = "#00bfff";

    if (powerUp.type === "score")
      ctx.fillStyle = "#ffd700";

    if (powerUp.type === "shrink")
      ctx.fillStyle = "#ff69b4";

    ctx.beginPath();

    ctx.arc(
      powerUp.x * tile + tile / 2,
      powerUp.y * tile + tile / 2,
      tile * 0.3,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }


  /* SNAKE */

  snake.forEach((part, index) => {

    ctx.fillStyle =
      index === 0 ? "#7CFF6B" : "#4CAF50";

    ctx.fillRect(
      part.x * tile + 2,
      part.y * tile + 2,
      tile - 4,
      tile - 4
    );
  });


  /* EYES */

  const head = snake[0];

  ctx.fillStyle = "black";

  ctx.fillRect(
    head.x * tile + 9,
    head.y * tile + 8,
    4,
    4
  );

  ctx.fillRect(
    head.x * tile + 17,
    head.y * tile + 8,
    4,
    4
  );
}


/* =========================
   COLLISION CHECK
========================= */

function isSnake(position) {

  return snake.some(part =>
    part.x === position.x &&
    part.y === position.y
  );
}


/* =========================
   DIRECTION
========================= */

function changeDirection(newDirection) {

  if (
    newDirection === "up" &&
    direction !== "down"
  ) {
    nextDirection = "up";
  }

  if (
    newDirection === "down" &&
    direction !== "up"
  ) {
    nextDirection = "down";
  }

  if (
    newDirection === "left" &&
    direction !== "right"
  ) {
    nextDirection = "left";
  }

  if (
    newDirection === "right" &&
    direction !== "left"
  ) {
    nextDirection = "right";
  }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(event) {

  if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
    changeDirection("up");
  }

  if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
    changeDirection("down");
  }

  if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
    changeDirection("left");
  }

  if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
    changeDirection("right");
  }

  if (event.code === "Space") {
    togglePause();
  }
});


/* =========================
   PAUSE
========================= */

function togglePause() {

  if (!gameRunning) return;

  paused = !paused;

  document.getElementById("pause")
    .textContent = paused
      ? "▶️ Verder"
      : "⏸ Pauze";

  document.getElementById("message")
    .textContent = paused
      ? "⏸ Gepauzeerd"
      : "";
}


/* =========================
   GAME OVER
========================= */

function endGame() {

  gameRunning = false;

  clearInterval(gameLoop);

  document.getElementById("message")
    .textContent =
      "💀 Game Over! Score: " + score;
}


/* =========================
   INITIAL DRAW
========================= */

draw();

</script>

</body>
</html>
```
