<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Empire 🍪</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    ```html
<a href="index.html" class="vogel-button">vogel op</a>

<style>
  .vogel-button {
    position: fixed;
    left: 15px;
    bottom: 15px;
    background: #4caf50;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }

  .vogel-button:hover {
    background: #45a049;
    transform: scale(1.05);
  }
</style>
```

    <main class="game">
        <h1>🍪 Cookie Empire</h1>

        <section class="stats">
            <div>
                <span id="cookies">0</span> cookies
            </div>
            <div>
                <span id="cps">0</span> cookies/sec
            </div>
        </section>

        <button id="cookie" class="cookie" aria-label="Klik op de cookie">
            🍪
        </button>

        <p class="hint">Klik op de cookie om cookies te verdienen!</p>

        <section class="shop">
            <h2>🛒 Shop</h2>

            <button id="cursor" class="upgrade">
                <span>
                    👆 Cursor
                    <small>+1 cookie/sec</small>
                </span>
                <strong><span id="cursorPrice">15</span> 🍪</strong>
            </button>

            <button id="grandma" class="upgrade">
                <span>
                    👵 Oma
                    <small>+5 cookies/sec</small>
                </span>
                <strong><span id="grandmaPrice">100</span> 🍪</strong>
            </button>

            <button id="factory" class="upgrade">
                <span>
                    🏭 Fabriek
                    <small>+25 cookies/sec</small>
                </span>
                <strong><span id="factoryPrice">500</span> 🍪</strong>
            </button>

            <button id="farm" class="upgrade">
                <span>
                    🌾 Koekjesboerderij
                    <small>+100 cookies/sec</small>
                </span>
                <strong><span id="farmPrice">2500</span> 🍪</strong>
            </button>
        </section>

        <section class="bottom">
            <button id="save">💾 Opslaan</button>
            <button id="reset">🗑️ Reset</button>
        </section>

        <p id="message"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
